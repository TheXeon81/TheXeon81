name: refresh

# Publishes at random intervals of 1 to 5 hours.
# Cron can't randomize, so it polls every 20 minutes and only acts once the
# "next" timestamp stored in README.md has passed; each publish then picks a
# new random gap for the next one.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Is it time?
        id: gate
        run: |
          now=$(date +%s)
          next=$(grep -oP '<!--next:\K[0-9]+' README.md || echo 0)
          echo "now=$now next=$next"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$now" -ge "$next" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "next publish in $(( (next - now) / 60 )) min"
          fi

      - uses: Platane/snk@v3
        if: steps.gate.outputs.go == 'true'
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/snake-light.svg?color_snake=#7c3aed

      - uses: crazy-max/ghaction-github-pages@v4
        if: steps.gate.outputs.go == 'true'
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update heartbeat and schedule next run
        if: steps.gate.outputs.go == 'true'
        run: |
          stamp=$(TZ=Europe/Rome date '+%F · %H:%M')
          gap=$(( 60 + RANDOM % 231 ))   # 60..290 minutes
          next=$(( $(date +%s) + gap * 60 ))
          echo "next publish in $gap min"
          sed -i -e "s|<!--hb-->.*<!--/hb-->|<!--hb-->$stamp<!--/hb-->|" \
                 -e "s|<!--next:[0-9]*-->|<!--next:$next-->|" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "heartbeat $stamp" && git push
