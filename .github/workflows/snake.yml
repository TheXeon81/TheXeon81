name: snake

# Draws the contribution snake and serves it from GitHub Pages.
# It never commits to the repo: the images live only on the Pages deployment.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  snake:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/snake-light.svg?color_snake=#7c3aed

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
